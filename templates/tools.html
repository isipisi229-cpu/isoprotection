<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kali Linux Əsas Alətlər</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #0b0b0b; 
            color: #00ff88; 
            font-family: 'Courier New', Courier, monospace; 
        }

        .cyber-nav {
            background-color: rgba(10, 10, 10, 0.9) !important;
            border-bottom: 2px solid #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }

        .tools-container {
            max-width: 800px;
        }

        .cyber-accordion-btn {
            background-color: #111111 !important;
            color: #00ff88 !important;
            border: 1px solid #00ff88 !important;
            font-weight: bold;
            text-align: left;
            width: 100%;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.05);
        }

        .cyber-accordion-btn:hover {
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
            background-color: #161616 !important;
        }

        .cyber-panel {
            background-color: rgba(15, 15, 15, 0.95);
            border: 1px dashed #00e1ff;
            color: #ffffff;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 225, 255, 0.1);
        }

        .terminal-box {
            background-color: #000000;
            border-left: 3px solid #00e1ff;
            color: #00e1ff;
            padding: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            margin-top: 15px;
        }

        .matrix-head {
            text-shadow: 0 0 10px #00ff88;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark cyber-nav sticky-top">
        <div class="container">
            <a class="navbar-brand text-success fw-bold" href="/">
                🛡️ IsoProtection
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-light" href="/">// HOME</a>
                <a class="nav-link text-success" href="/kursa-basla">// COURSES_</a>
                <a class="nav-link text-success active" href="/tools">// KALI_TOOLS_</a>
            </div>
        </div>
    </nav>

    <div class="container tools-container mt-5">
        <h2 class="text-center matrix-head mb-3">🛠️ KALI_LINUX_CORE_TOOLS</h2>
        <p class="text-center text-muted mb-5">// Ən lazımlı kiber təhlükəsizlik alətləri və təlimatları:</p>

        <div class="mt-4">
            {% for tool in tools %}
            <div>
                <button class="btn cyber-accordion-btn" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-{{ tool.id }}">
                    [+] {{ tool.ad }} <span class="float-end text-muted" style="font-size: 0.8rem;">// {{ tool.kateqoriya }}</span>
                </button>
                
                <div class="collapse" id="collapse-{{ tool.id }}">
                    <div class="cyber-panel">
                        <strong class="text-success">Təsvir:</strong>
                        <p class="mt-2" style="font-family: sans-serif; line-height: 1.6;">{{ tool.aciqlama }}</p>
                        
                        <div class="terminal-box">
                            <span class="text-danger">root@kali:~#</span> {{ tool.komanda }}
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="text-center mt-5 mb-5">
            <a href="/" class="btn btn-outline-secondary btn-sm px-4">// BACK_TO_MAIN</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
