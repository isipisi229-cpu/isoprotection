<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ kurs.ad }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #ffffff; /* ARXA FON AĞ EDİLDİ */
            color: #00ff88; 
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            position: relative;
        }
        
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        .cyber-nav {
            background-color: rgba(10, 10, 10, 0.9) !important;
            border-bottom: 2px solid #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }
        
        .cyber-card { 
            background-color: rgba(15, 15, 15, 0.95); /* Kartın daxili oxunaqlı qalsın deyə tünd saxlanıldı */
            border: 2px solid #00ff88; 
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.25), inset 0 0 15px rgba(0, 255, 136, 0.1);
            backdrop-filter: blur(5px);
        }

        .matrix-text {
            text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
        }
        
        .btn-cyber { 
            background-color: transparent; 
            color: #00ff88; 
            border: 2px solid #00ff88;
            font-weight: bold; 
            transition: all 0.4s ease; 
        }
        
        .btn-cyber:hover { 
            background-color: #00ff88; 
            color: #000000; 
            box-shadow: 0 0 20px #00ff88;
            transform: scale(1.05);
        }

        .text-info-matrix {
            color: #00e1ff;
            text-shadow: 0 0 5px rgba(0, 225, 255, 0.5);
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <nav class="navbar navbar-expand-lg navbar-dark cyber-nav sticky-top">
        <div class="container">
            <a class="navbar-brand text-success fw-bold" href="/">
                🛡️ IsoProtection
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-light active" href="/">// HOME</a>
                <a class="nav-link text-success" href="/kursa-basla">// COURSES_</a>
                <a class="nav-link text-success" href="/tools">// KALI_TOOLS_</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-4">
        <div class="row justify-content-center">
            <div class="col-md-9 text-center">
                <div class="card cyber-card p-5 shadow-lg">
                    <h1 class="matrix-text mb-4">{{ kurs.ad }}</h1>
                    <p class="lead mb-4 text-light" style="font-family: sans-serif; font-size: 1.2rem;">{{ kurs.tesvir }}</p>
                    
                    <hr style="border-top: 2px solid #00ff88; opacity: 0.4;" class="my-4">
                    
                    <div class="my-4 text-start d-inline-block">
                        <h5 class="mb-3">▶ [SYSTEM_STATUS]: <span class="text-success">ONLINE</span></h5>
                        <h5 class="mb-3">▶ [CONTACT_NUM]: <span class="text-info-matrix">{{ kurs.elaqe }}</span></h5>
                        <h5>▶ [EMAIL_ADDR]: <span class="text-info-matrix">{{ kurs.email }}</span></h5>
                    </div>

                    <div class="mt-5">
                        <a href="/kursa-basla" class="btn btn-cyber btn-lg px-5 py-3">⚡ RUN_PROGRAM_</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const katakana = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const alphabet = katakana.split('');
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = [];
        for( let x = 0; x < columns; x++ ) { rainDrops[x] = 1; }
        const draw = () => {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)'; /* Yağış ağ fonda da qəşəng görünsün */
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff88';
            ctx.font = fontSize + 'px monospace';
            for(let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i*fontSize, rainDrops[i]*fontSize);
                if(rainDrops[i]*fontSize > canvas.height && Math.random() > 0.975){ rainDrops[i] = 0; }
                rainDrops[i]++;
            }
        };
        setInterval(draw, 30);
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    </script>
</body>
</html>
