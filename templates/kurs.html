<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurs Səviyyələri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #ffffff; /* ARXA FON AĞ EDİLDİ */
            color: #00ff88; 
            font-family: 'Courier New', Courier, monospace; 
        }

        .cyber-nav {
            background-color: rgba(10, 10, 10, 0.9) !important;
            border-bottom: 2px solid #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }
        
        .level-card { 
            background-color: rgba(20, 20, 20, 0.95); 
            border-radius: 8px; 
            transition: all 0.3s ease; 
        }
        
        .border-success-matrix { border: 2px solid #00ff88; box-shadow: 0 0 15px rgba(0, 255, 136, 0.15); }
        .border-warning-matrix { border: 2px solid #ffaa00; box-shadow: 0 0 15px rgba(255, 170, 0, 0.15); }
        .border-danger-matrix { border: 2px solid #ff3333; box-shadow: 0 0 15px rgba(255, 51, 51, 0.15); }

        .level-card:hover { transform: translateY(-8px); }
        .border-success-matrix:hover { box-shadow: 0 0 25px rgba(0, 255, 136, 0.4); }
        .border-warning-matrix:hover { box-shadow: 0 0 25px rgba(255, 170, 0, 0.4); }
        .border-danger-matrix:hover { box-shadow: 0 0 25px rgba(255, 51, 51, 0.4); }

        .matrix-head { text-shadow: 0 0 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark cyber-nav sticky-top">
        <div class="container">
            <a class="navbar-brand text-success fw-bold" href="/">
                🛡️ IsoProtection
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-light" href="/">// HOME</a>
                <a class="nav-link text-success active" href="/kursa-basla">// COURSES_</a>
                <a class="nav-link text-success" href="/tools">// KALI_TOOLS_</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center text-dark matrix-head mb-4">🛡️ ACCESS_LEVEL_SELECTION</h2>
        <p class="text-center text-muted mb-5">// Tədris proqramı səviyyəsini seçin:</p>

        <div class="row mt-4 justify-content-center">
            {% for seviyye in seviyyeler %}
            <div class="col-md-4 mb-4">
                <div class="card level-card h-100 p-3 
                    {% if seviyye.id == 'ilkin' %} border-success-matrix 
                    {% elif seviyye.id == 'orta' %} border-warning-matrix 
                    {% else %} border-danger-matrix {% endif %}">
                    
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div>
                            <h4 class="card-title {% if seviyye.id == 'ilkin' %} text-success {% elif seviyye.id == 'orta' %} text-warning {% else %} text-danger {% endif %}">
                                > {{ seviyye.ad }}
                            </h4>
                            <!-- Buradakı text-light klasını text-danger (qırmızı) ilə əvəzlədik -->
                            <p class="card-text text-danger mt-3" style="font-family: sans-serif; text-align: justify; font-size: 0.95rem; line-height: 1.5; font-weight: bold;">
                                {{ seviyye.aciqlama }}
                            </p>
                        </div>
                        <div class="mt-4">
                            <a href="/kurs/{{ seviyye.id }}" class="btn w-100 fw-bold
                            {% if seviyye.id == 'ilkin' %} btn-outline-success 
                            {% elif seviyye.id == 'orta' %} btn-outline-warning 
                            {% else %} btn-outline-danger {% endif %}">VIEW_SYLLABUS_</a>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="text-center mt-5 mb-5">
            <a href="/" class="btn btn-outline-secondary btn-sm px-4">// BACK_TO_MAIN</a>
        </div>
    </div>

</body>
</html>
