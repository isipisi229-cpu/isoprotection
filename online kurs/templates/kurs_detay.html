<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ seviyye.ad }} - Tədris Proqramı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #ffffff; /* ARXA FON AĞ EDİLDİ */
            color: #ffffff; 
            font-family: 'Courier New', Courier, monospace; 
        }

        .cyber-nav {
            background-color: rgba(10, 10, 10, 0.9) !important;
            border-bottom: 2px solid #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }

        .detay-card {
            background-color: #111111;
            border-radius: 10px;
            padding: 40px;
            margin-top: 50px;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.1);
        }

        .border-success-detay { border: 2px solid #00ff88; }
        .border-warning-detay { border: 2px solid #ffaa00; }
        .border-danger-detay { border: 2px solid #ff3333; }

        .program-list {
            list-style: none;
            padding-left: 0;
        }

        .program-item {
            background-color: #161616;
            margin-bottom: 12px;
            padding: 15px 20px;
            border-left: 4px solid #ff3333; /* Sol xətt qırmızı edildi */
            color: #ff3333; /* MƏLUMAT YAZILARI QIRMIZI EDİLDİ */
            font-family: sans-serif;
            font-size: 1.05rem;
            font-weight: bold;
        }

        .matrix-title {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark cyber-nav sticky-top">
        <div class="container">
            <a class="navbar-brand text-success fw-bold" href="/">
                🛡️ IsoProtection
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-light" href="/">// HOME</a>
                <a class="nav-link text-success active" href="/kursa-basla">// COURSES_</a>
                <a class="nav-link text-success" href="/tools">// KALI_TOOLS_</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 850px;">
        <div class="card detay-card 
            {% if seviyye.reng == 'success' %} border-success-detay 
            {% elif seviyye.reng == 'warning' %} border-warning-detay 
            {% else %} border-danger-detay {% endif %}">
            
            <h2 class="matrix-title {% if seviyye.reng == 'success' %} text-success {% elif seviyye.reng == 'warning' %} text-warning {% else %} text-danger {% endif %}">
                > {{ seviyye.ad }}
            </h2>
            <p class="text-muted mt-2">// DETAILED_SYLLABUS_MODULES</p>
            
            <hr style="border-top: 1px dashed #666;" class="my-4">
            
            <h4 class="mb-4 text-info">> Bu Səviyyədə Nələri Öyrənəcəksiniz?</h4>
            
            <ul class="program-list">
                {% for ders in seviyye.proqram %}
                <li class="program-item">
                    <span class="text-success fw-bold font-monospace">✔ Module_{{ loop.index }}:</span> {{ ders }}
                </li>
                {% endfor %}
            </ul>

            <div class="mt-5 d-flex justify-content-between">
                <a href="/kursa-basla" class="btn btn-outline-secondary">// BACK_TO_LEVELS</a>
                <a href="mailto:isomprotection@gmail.com" class="btn btn-outline-success">⚡ REGISTER_FOR_THIS_LEVEL_</a>
            </div>
        </div>
    </div>

</body>
</html>
